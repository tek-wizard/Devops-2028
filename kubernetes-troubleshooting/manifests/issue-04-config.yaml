# Broken: refers to a ConfigMap key that does not exist.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
data:
  LOG_LEVEL: "debug"
---
apiVersion: v1
kind: Pod
metadata:
  name: broken-config
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: API_KEY
          valueFrom:
            configMapKeyRef:
              name: app-settings
              key: API_KEY
