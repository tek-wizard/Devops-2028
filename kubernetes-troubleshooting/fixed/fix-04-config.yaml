# Fixed: the ConfigMap now has the key the Pod asks for.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings-fixed
data:
  LOG_LEVEL: "debug"
  API_KEY: "demo-key-12345"
---
apiVersion: v1
kind: Pod
metadata:
  name: fixed-config
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "echo API_KEY is $API_KEY; sleep 3600"]
      env:
        - name: API_KEY
          valueFrom:
            configMapKeyRef:
              name: app-settings-fixed
              key: API_KEY
