apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          # the page comes from a ConfigMap mounted as a file
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
      volumes:
        - name: page
          configMap:
            name: backend-page
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 80
