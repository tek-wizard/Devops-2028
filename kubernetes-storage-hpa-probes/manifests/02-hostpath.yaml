# hostPath mounts a folder from the node itself into the Pod.
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "echo 'written into the node filesystem' > /node-data/hello.txt; sleep 3600"]
      volumeMounts:
        - name: node-data
          mountPath: /node-data
  volumes:
    - name: node-data
      hostPath:
        path: /tmp/hostpath-demo
        type: DirectoryOrCreate
