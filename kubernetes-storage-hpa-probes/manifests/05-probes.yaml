# All three probe types on one Pod so I can see what each one does.
apiVersion: v1
kind: Pod
metadata:
  name: probes-demo
spec:
  containers:
    - name: web
      image: nginx:alpine
      ports:
        - containerPort: 80
      # startupProbe runs first. The other two wait until it passes,
      # which gives a slow app time to boot without being killed.
      startupProbe:
        httpGet:
          path: /
          port: 80
        failureThreshold: 30
        periodSeconds: 2
      # readinessProbe decides if the Pod gets traffic from a Service.
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
      # livenessProbe decides if the container gets restarted.
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
