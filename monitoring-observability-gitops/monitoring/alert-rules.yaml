# Custom alert rules. The Prometheus operator picks up any PrometheusRule
# with the right label and loads it automatically.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devops-2028-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: devops-2028.rules
      rules:
        # fires when a pod restarts repeatedly, which is the CrashLoopBackOff
        # situation from the troubleshooting homework
        - alert: PodRestartingTooOften
          expr: increase(kube_pod_container_status_restarts_total[10m]) > 3
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} keeps restarting"
            description: "{{ $labels.namespace }}/{{ $labels.pod }} restarted more than 3 times in 10 minutes."

        - alert: PodNotReady
          expr: kube_pod_status_ready{condition="false"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} has not been ready for 5 minutes"

        - alert: ContainerHighCpu
          expr: |
            sum(rate(container_cpu_usage_seconds_total{container!=""}[5m])) by (pod, namespace)
            /
            sum(kube_pod_container_resource_limits{resource="cpu"}) by (pod, namespace) > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} is using over 90% of its CPU limit"

        - alert: ContainerHighMemory
          expr: |
            sum(container_memory_working_set_bytes{container!=""}) by (pod, namespace)
            /
            sum(kube_pod_container_resource_limits{resource="memory"}) by (pod, namespace) > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} is using over 90% of its memory limit"
