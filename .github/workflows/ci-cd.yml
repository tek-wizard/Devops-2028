name: CI/CD Pipeline

# CI runs on every push and pull request to main.
# CD only runs on a push to main, not on pull requests.
on:
  push:
    branches: [main]
    paths:
      - 'cicd-github-actions/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cicd-demo

jobs:
  # ---------------- CI ----------------
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: cicd-github-actions/app
        run: npm install

      - name: Run unit tests
        working-directory: cicd-github-actions/app
        run: npm test

      - name: Save the test output as an artifact
        working-directory: cicd-github-actions/app
        run: npm test > test-results.txt 2>&1 || true

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: cicd-github-actions/app/test-results.txt
          retention-days: 7

  # ---------------- CD ----------------
  docker-build-and-push:
    name: Build the image and push it
    runs-on: ubuntu-latest
    # only runs if the tests passed
    needs: build-and-test
    # and only on a real push to main, not on a pull request
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # GHCR only accepts lowercase image paths and this repo is "Devops-2028",
      # so the name has to be lowercased before it is used as a tag.
      - name: Lowercase the image name
        run: echo "IMAGE_NAME_LC=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is provided by Actions, I did not have to create a secret
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cicd-github-actions
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Show what was pushed
        run: |
          echo "Pushed these tags:"
          echo "${{ steps.meta.outputs.tags }}"
